<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" stroke="#e4bf6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Grid: slim perimeter frame and mullions, flat grid bars dividing every panel into tall panes, level across the enclosure, framed door with a lever -->
  <rect x="10" y="18" width="76" height="60" fill="#e4bf6e" fill-opacity="0.08" stroke="none"/>
  <!-- perimeter frame -->
  <rect x="9" y="16" width="78" height="64" stroke-width="3"/>
  <!-- vertical mullions at panel joints -->
  <line x1="34" y1="16" x2="34" y2="80" stroke-width="3"/>
  <line x1="60" y1="16" x2="60" y2="80" stroke-width="3"/>
  <!-- grid bars: horizontal bars level across every panel and the door -->
  <line x1="9" y1="37" x2="87" y2="37" stroke-width="1.5"/>
  <line x1="9" y1="59" x2="87" y2="59" stroke-width="1.5"/>
  <!-- grid bars: one vertical bar inside each fixed panel -->
  <line x1="21.5" y1="16" x2="21.5" y2="80" stroke-width="1.5"/>
  <line x1="47" y1="16" x2="47" y2="80" stroke-width="1.5"/>
  <!-- glass highlight -->
  <line x1="38" y1="21" x2="43" y2="26" stroke-opacity="0.45"/>
  <!-- door (right panel): hinges on the left stile, lever on the right -->
  <line x1="60" y1="27" x2="63" y2="27" stroke-width="3"/>
  <line x1="60" y1="70" x2="63" y2="70" stroke-width="3"/>
  <line x1="76" y1="48" x2="83" y2="48" stroke-width="3"/>
</svg>
