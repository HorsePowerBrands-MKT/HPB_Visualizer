<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" stroke="#e4bf6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Framed: slim perimeter frame, thin vertical mullions at panel joints, framed door with a lever handle -->
  <rect x="10" y="18" width="76" height="60" fill="#e4bf6e" fill-opacity="0.08" stroke="none"/>
  <!-- perimeter frame -->
  <rect x="9" y="16" width="78" height="64" stroke-width="3"/>
  <!-- vertical mullions -->
  <line x1="34" y1="16" x2="34" y2="80" stroke-width="3"/>
  <line x1="60" y1="16" x2="60" y2="80" stroke-width="3"/>
  <!-- glass highlights -->
  <line x1="16" y1="26" x2="26" y2="36" stroke-opacity="0.45"/>
  <line x1="40" y1="26" x2="52" y2="38" stroke-opacity="0.45"/>
  <!-- framed door (right panel): inner door frame + hinges + lever -->
  <rect x="63" y="19" width="21" height="58" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="63" y1="30" x2="66" y2="30" stroke-width="3"/>
  <line x1="63" y1="66" x2="66" y2="66" stroke-width="3"/>
  <line x1="73" y1="49" x2="81" y2="49" stroke-width="3"/>
</svg>
